# 服务器配置
server:
  port: ${SERVER_PORT:8085}  # 默认8085，可通过环境变量覆盖
  servlet:
    context-path: /immuse-risk
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 200
      min-spare: 10

spring:
  # 数据源配置（替换为环境变量）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # Jackson配置（保留）
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

  # 文件上传配置（保留）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 静态资源配置（保留）
  web:
    resources:
      static-locations: classpath:static/,file:${file.upload-dir}
  mvc:
    static-path-pattern: /**

  # 邮件配置（替换为环境变量）
  mail:
    host: smtp.qq.com
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: true
    port: 465
    default-encoding: UTF-8
    nickname: 自身免疫病风险预测平台

  # redis配置（替换为环境变量）
  date:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 100ms
          time-between-eviction-runs: 30s

# 自定义配置（替换为环境变量）
image:
  base-path: ${IMAGE_BASE_PATH}
# 文件上传路径配置
file:
  upload-dir: ./upload/

# MyBatis配置（保留）
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.immuse_risk.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Shiro配置（保留）
shiro:
  web:
    enabled: true
  loginUrl: /login
  successUrl: /index
  unauthorizedUrl: /unauthorized
  sessionManager:
    sessionIdCookieEnabled: true
    sessionIdUrlRewritingEnabled: false

# Deepseek配置（替换为环境变量）
youDeepseekApi:
  url: ${DEEPSEEK_URL}
  key: ${DEEPSEEK_KEY}